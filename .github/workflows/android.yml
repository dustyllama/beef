name: Android Debug APK

on:
  push:
    branches: [ master, main, neurontap-build, aves-v2, horny-archives-v3, neurontap-v4, neurontap-v5-rc1, neurontap-v6 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply v0.5 field-test patch
        run: python3 tools/apply_v5_feedback.py

      - name: Apply v0.6 core patch
        run: python3 tools/apply_v6_core.py

      - name: Apply v0.6 viewer patch
        run: python3 tools/apply_v6_viewer.py

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neurontap-v0.6-apk
          path: app/build/outputs/apk/debug/app-debug.apk