name: Android Debug APK

on:
  push:
    branches: [ master, main, neurontap-build, aves-v2, horny-archives-v3, neurontap-v4, neurontap-v5-rc1, neurontap-v6, neurontap-v7, neurontap-v8 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply v0.5 field-test patch
        run: python3 tools/apply_v5_feedback.py

      - name: Normalize version input
        run: |
          sed -i 's/versionCode = 5/versionCode = 4/' app/build.gradle.kts
          sed -i 's/versionName = "0.5.0"/versionName = "0.4.0"/' app/build.gradle.kts

      - name: Apply v0.6 core patch
        run: python3 tools/apply_v6_core.py

      - name: Apply v0.6 viewer patch
        run: python3 tools/apply_v6_viewer.py

      - name: Fix v0.6 gesture animation state
        run: python3 tools/fix_v6_anim.py

      - name: Apply v0.7 core and migration
        run: python3 tools/apply_v7_core.py

      - name: Apply v0.7 nested Collections
        run: python3 tools/apply_v7_organizer.py

      - name: Apply v0.7 viewer foundation
        run: python3 tools/apply_v7_viewer_base.py

      - name: Apply v0.7 configurable controls
        run: python3 tools/apply_v7_controls.py

      - name: Apply v0.7 video rewrite
        run: python3 tools/apply_v7_video.py

      - name: Apply v0.7 gallery rewrite
        run: python3 tools/apply_v7_gallery.py

      - name: Apply v0.7 archive analytics
        run: python3 tools/apply_v7_analytics.py

      - name: Apply v0.7 compile fixes
        run: python3 tools/fix_v7_compile1.py

      - name: Apply v0.8 performance pipeline
        run: python3 tools/apply_v8_performance.py

      - name: Repair v0.8 control patch anchor
        run: python3 tools/fix_v8_controls_anchor.py

      - name: Apply v0.8 control semantics
        run: python3 tools/apply_v8_controls.py

      - name: Apply v0.8 gallery and navigation fixes
        run: python3 tools/apply_v8_gallery.py

      - name: Integrate v0.8 single-player video host
        run: python3 tools/apply_v8_video_integration.py

      - name: Apply v0.8 activity storm and Tag Lab repairs
        run: python3 tools/apply_v8_analytics.py

      - name: Apply v0.8 security defaults
        run: python3 tools/apply_v8_security.py

      - name: Apply v0.8 compile fixes
        run: python3 tools/fix_v8_compile1.py

      - name: Reduce v0.8 scroll persistence churn
        run: python3 tools/fix_v8_scroll_churn.py

      - name: Repair v0.8 live MediaStore indexing
        run: python3 tools/apply_v8_indexing_repair.py

      - name: Apply v0.8.3 viewer and navigation repair
        run: python3 tools/apply_v8_repair_mainline.py

      - name: Apply v0.8.3 provider video thumbnails
        run: python3 tools/apply_v8_thumbnail_repair.py

      - name: Apply v0.8 targeted lint opt-ins
        run: python3 tools/fix_v8_lint.py

      - name: Harden emulator boot probe
        run: python3 tools/fix_v8_emulator_boot.py

      - name: Harden MediaStore QA
        run: python3 tools/harden_v8_smoke_v2.py

      - name: Fix smoke screenshot parsing
        run: python3 tools/fix_v8_smoke_ffprobe.py

      - name: Make aspect QA isolate actual video pixels
        run: python3 tools/fix_v8_smoke_aspect_probe.py

      - name: Set v0.8.3 update identity
        run: |
          sed -i 's/versionCode = 8/versionCode = 12/' app/build.gradle.kts
          sed -i 's/versionName = "0.8.0"/versionName = "0.8.3"/' app/build.gradle.kts
          grep -q 'versionCode = 12' app/build.gradle.kts
          grep -q 'versionName = "0.8.3"' app/build.gradle.kts

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Verify update identity and signature
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | tee /tmp/badging.txt
          grep -q "package: name='com.neurontap.app' versionCode='12' versionName='0.8.3'" /tmp/badging.txt
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Deterministic emulator torture QA
        timeout-minutes: 25
        run: bash -x tools/v8_emulator_smoke_v2.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Collect failed emulator QA evidence
        if: failure()
        run: |
          mkdir -p qa-diagnostics
          cp /tmp/nt-*.png qa-diagnostics/ 2>/dev/null || true
          cp /tmp/nt-*.xml qa-diagnostics/ 2>/dev/null || true
          cp /tmp/nt-emulator.log qa-diagnostics/ 2>/dev/null || true
          cp /tmp/badging.txt qa-diagnostics/ 2>/dev/null || true
          find qa-diagnostics -maxdepth 1 -type f -printf '%f\n' | sort || true

      - name: Upload failed emulator QA evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: neurontap-v0.8.3-qa-failure-evidence
          path: qa-diagnostics
          if-no-files-found: warn

      - name: Upload QA-passed v0.8.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: neurontap-v0.8.3-apk
          path: app/build/outputs/apk/debug/app-debug.apk
