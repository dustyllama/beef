name: Android Debug APK

on:
  push:
    branches: [ master, main, neurontap-build, aves-v2, horny-archives-v3, neurontap-v4, neurontap-v5-rc1, neurontap-v6, neurontap-v7, neurontap-v7-rescue ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply v0.5 field-test patch
        run: python3 tools/apply_v5_feedback.py

      - name: Normalize version input
        run: |
          sed -i 's/versionCode = 5/versionCode = 4/' app/build.gradle.kts
          sed -i 's/versionName = "0.5.0"/versionName = "0.4.0"/' app/build.gradle.kts

      - name: Apply v0.6 core patch
        run: python3 tools/apply_v6_core.py

      - name: Apply v0.6 viewer patch
        run: python3 tools/apply_v6_viewer.py

      - name: Fix v0.6 gesture animation state
        run: python3 tools/fix_v6_anim.py

      - name: Apply v0.7 core and migration
        run: python3 tools/apply_v7_core.py

      - name: Apply v0.7 nested Collections
        run: python3 tools/apply_v7_organizer.py

      - name: Apply v0.7 viewer foundation
        run: python3 tools/apply_v7_viewer_base.py

      - name: Apply v0.7 configurable controls
        run: python3 tools/apply_v7_controls.py

      - name: Apply v0.7 video rewrite
        run: python3 tools/apply_v7_video.py

      - name: Apply v0.7 gallery rewrite
        run: python3 tools/apply_v7_gallery.py

      - name: Apply v0.7 archive analytics
        run: python3 tools/apply_v7_analytics.py

      - name: Apply v0.7 compile fixes
        run: python3 tools/fix_v7_compile1.py

      - name: Make rescue build install over v0.8
        run: |
          sed -i 's/versionCode = 7/versionCode = 9/' app/build.gradle.kts
          sed -i 's/versionName = "0.7.0"/versionName = "0.7.1-rescue"/' app/build.gradle.kts
          grep -q 'versionCode = 9' app/build.gradle.kts
          grep -q 'versionName = "0.7.1-rescue"' app/build.gradle.kts

      - name: Scope Media3 experimental API lint opt-in
        run: |
          cat > app/lint.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <lint>
              <issue id="UnsafeOptInUsageError">
                  <option name="opt-in" value="androidx.media3.common.util.UnstableApi" />
              </issue>
          </lint>
          EOF

      - name: Build rescue APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Verify rescue identity and signature
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | tee /tmp/badging.txt
          grep -q "package: name='com.neurontap.app' versionCode='9' versionName='0.7.1-rescue'" /tmp/badging.txt
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload rescue APK
        uses: actions/upload-artifact@v4
        with:
          name: neurontap-v0.7-rescue-apk
          path: app/build/outputs/apk/debug/app-debug.apk
